baseURL = 'https://celero0.github.io/'
locale = 'es'
defaultContentLanguage = 'es'
title = 'Celero0 Blog'
theme = "hugo-coder"

##### Acá cambié todo para agregar contenido
[pagination]
pagerSize = 20

#[services]
#[services.disqus]
#shortname = "yourdiscussshortname"

[markup.highlight]
style = "github-dark"

[params]
  author = "CeleroRKX"
  info = "Junior Penetration Tester <br> Estudiante de Ing. en Conectividad y Redes  <br>eJPT & CCST · Preparando CWES"
  description = "Writeups de pentesting, máquinas de HackTheBox y proyectos de ciberseguridad ofensiva."
  keywords = "ciberseguridad, pentesting, hacking ético, HackTheBox, writeups, redes, eJPT, CWES"
  avatarurl = "images/avatar.jpg"
  #gravatar = "john.doe@example.com"
  mainSections = ["posts"]
  faviconSVG = "/img/favicon.svg"
  favicon_32 = "/img/favicon-32x32.png"
  favicon_16 = "/img/favicon-16x16.png"

  since = 2025

  enableTwemoji = true

  dateFormat = "2 de January de 2006"

  colorScheme = "dark"
  hidecolorschemetoggle = false

  # customCSS = ["css/custom.css"]
  customSCSS = ["scss/custom.scss"]
  customJS = ["js/gestures.js"]

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"
  author = "authors"

